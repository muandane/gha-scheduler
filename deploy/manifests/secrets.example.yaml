# Example secret keys — DO NOT commit real values.
# Create in cluster:
#   kubectl -n gha-runners create secret generic gha-scheduler-secrets \
#     --from-literal=webhook-secret='...' \
#     --from-literal=app-id='123456' \
#     --from-literal=installation-id='789' \
#     --from-file=app-private-key=./gha-app.pem
apiVersion: v1
kind: Secret
metadata:
  name: gha-scheduler-secrets
  namespace: gha-runners
type: Opaque
stringData:
  webhook-secret: "REPLACE_GH_WEBHOOK_SECRET"
  app-id: "REPLACE_GH_APP_ID"
  installation-id: "REPLACE_GH_INSTALLATION_ID"
  app-private-key: |
    -----BEGIN RSA PRIVATE KEY-----
    REPLACE_WITH_PEM_CONTENTS
    -----END RSA PRIVATE KEY-----
