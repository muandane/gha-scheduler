# SeaweedFS S3 identity config. accessKey/secretKey must match gha-cache-s3-credentials.
apiVersion: v1
kind: ConfigMap
metadata:
  name: seaweedfs-s3-config
  namespace: gha-runners
data:
  s3.json: |
    {
      "identities": [
        {
          "name": "gha-cache",
          "credentials": [
            {
              "accessKey": "REPLACE_S3_ACCESS_KEY",
              "secretKey": "REPLACE_S3_SECRET_KEY"
            }
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        }
      ]
    }
