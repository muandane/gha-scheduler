# HTTPRoute for GitHub App webhook delivery via homelab Tailscale gateway.
# parentRefs match cluster/kubernetes/private/gateway (ts-gateway in gateway namespace).
# Set hostnames to your GATEWAY_DOMAIN entry for gha-scheduler webhook.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gha-scheduler-webhook
  namespace: gha-runners
spec:
  parentRefs:
    - name: ts-gateway
      namespace: gateway
  hostnames:
    - "gha-scheduler.example.com"  # replace: public hostname GitHub webhook targets
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /webhook
      backendRefs:
        - name: gha-scheduler
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /healthz
      backendRefs:
        - name: gha-scheduler
          port: 8080
