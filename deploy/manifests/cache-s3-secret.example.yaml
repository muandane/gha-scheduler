# S3 credentials for cache sidecar (shared with SeaweedFS when using homelab install).
# kubectl -n gha-runners create secret generic gha-cache-s3-credentials \
#   --from-literal=access-key='...' --from-literal=secret-key='...'
apiVersion: v1
kind: Secret
metadata:
  name: gha-cache-s3-credentials
  namespace: gha-runners
type: Opaque
stringData:
  access-key: "REPLACE_S3_ACCESS_KEY"
  secret-key: "REPLACE_S3_SECRET_KEY"
