# Internal HTTPRoute for the gha-scheduler console (Tailscale gateway).
# Webhook ingress remains separate — GitHub only needs /webhook.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gha-scheduler-console
  namespace: gha-runners
spec:
  parentRefs:
    - name: ts-gateway
      namespace: gateway
  hostnames:
    - "gha-console.example.com"  # replace: internal hostname for console UI
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: gha-scheduler
          port: 8080
