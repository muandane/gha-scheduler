apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gha-scheduler
  namespace: gha-runners
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "secrets"]
    # delete: dispatch removes orphan JIT secrets when Job create fails (see deploy/RBAC.md)
    verbs: ["create", "get", "list", "watch", "update", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gha-scheduler
  namespace: gha-runners
subjects:
  - kind: ServiceAccount
    name: gha-scheduler
    namespace: gha-runners
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gha-scheduler
