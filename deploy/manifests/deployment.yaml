apiVersion: apps/v1
kind: Deployment
metadata:
  name: gha-scheduler
  namespace: gha-runners
  labels:
    app: gha-scheduler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gha-scheduler
  template:
    metadata:
      labels:
        app: gha-scheduler
    spec:
      serviceAccountName: gha-scheduler
      containers:
        - name: scheduler
          image: ${GHA_SCHEDULER_IMAGE}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: job-store
              mountPath: /data
          envFrom:
            - configMapRef:
                name: gha-scheduler
          env:
            - name: GHA_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: gha-scheduler-secrets
                  key: webhook-secret
            - name: GHA_APP_ID
              valueFrom:
                secretKeyRef:
                  name: gha-scheduler-secrets
                  key: app-id
            - name: GHA_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: gha-scheduler-secrets
                  key: installation-id
            - name: GHA_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: gha-scheduler-secrets
                  key: app-private-key
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: gha-scheduler
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
                  optional: true
            - name: OTEL_SERVICE_NAME
              value: gha-scheduler
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
      volumes:
        - name: job-store
          persistentVolumeClaim:
            claimName: gha-scheduler-job-store
