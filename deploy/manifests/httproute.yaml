# GitHub App webhook + health via Envoy Gateway (ts-gateway-internal).
# Requires a matching Gateway listener (see platforms-flux gateway/home).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gha-scheduler-webhook
  namespace: gha-runners
  labels:
    app.kubernetes.io/name: gha-scheduler
    app.kubernetes.io/component: webhook
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ${GHA_GATEWAY_NAME}
      namespace: ${GHA_GATEWAY_NAMESPACE}
      sectionName: ${GHA_GATEWAY_SECTION}
  hostnames:
    - "${GHA_WEBHOOK_HOSTNAME}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /webhook
      backendRefs:
        - group: ""
          kind: Service
          name: gha-scheduler
          port: 8080
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /healthz
      backendRefs:
        - group: ""
          kind: Service
          name: gha-scheduler
          port: 8080
          weight: 1
